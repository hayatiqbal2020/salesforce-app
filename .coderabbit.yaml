language: en-US

reviews:
  profile: chill          # "chill" = fewer nitpicks, "assertive" = stricter
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false          # skip draft PRs until marked ready

  path_instructions:
    - path: "force-app/main/default/classes/**/*.cls"
      instructions: >
        Review Apex classes for bulkification (no SOQL/DML inside loops),
        proper exception handling, and adherence to sharing rules
        (with sharing / without sharing should be explicit and intentional).

    - path: "force-app/main/default/classes/**/*Test.cls"
      instructions: >
        Check that test classes use @TestSetup or Test.startTest()/stopTest()
        correctly, avoid hardcoded IDs, and assert meaningful outcomes
        rather than just absence of exceptions.

    - path: "force-app/main/default/lwc/**/*.js"
      instructions: >
        Review Lightning Web Components for correct use of @wire, avoid
        unnecessary Apex calls in render paths, and check for proper
        error handling on imperative Apex calls.

    - path: "force-app/main/default/triggers/**/*.trigger"
      instructions: >
        Ensure triggers are thin (logic delegated to a handler class) and
        do not contain direct SOQL/DML without bulk-safe patterns.

chat:
  auto_reply: true

tone_instructions: >
  Be concise and specific. Point to the exact line and explain the risk,
  not just the rule being broken.