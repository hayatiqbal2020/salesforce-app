name: Deploy to Salesforce on Merge to Main

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full history for git diff

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Install sfdx-git-delta plugin
        run: sf plugins install sfdx-git-delta

      - name: Verify sf CLI install
        run: sf --version

      - name: Authenticate to Salesforce org via JWT
        env:
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
        run: |
          echo "$SF_JWT_KEY" > ./server.key
          sf org login jwt \
            --client-id "${{ secrets.SF_CONSUMER_KEY }}" \
            --jwt-key-file ./server.key \
            --username "${{ secrets.SF_USERNAME }}" \
            --instance-url "${{ secrets.SF_INSTANCE_URL }}" \
            --alias target-org \
            --set-default
          rm ./server.key

      - name: Generate delta package
        run: |
          mkdir -p delta
          sf sgd source delta \
            --to "HEAD" \
            --from "HEAD~1" \
            --output delta/ \
            --generate-delta

      - name: Check if delta has any changes
        id: check_delta
        run: |
          if [ -d "delta/force-app" ] && [ "$(find delta/force-app -type f | wc -l)" -gt 0 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy delta to Salesforce org
        if: steps.check_delta.outputs.has_changes == 'true'
        run: |
          sf project deploy start \
            --source-dir delta/force-app \
            --target-org target-org \
            --test-level RunLocalTests \
            --wait 60

      - name: No changes to deploy
        if: steps.check_delta.outputs.has_changes == 'false'
        run: echo "No metadata changes detected — skipping deploy."

      - name: Post deployment result
        if: always()
        run: echo "Deployment step completed with status ${{ job.status }}"