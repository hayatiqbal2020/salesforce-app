name: Validate Salesforce Deployment on PR

# Runs whenever a PR is opened/updated against main (adjust branches as needed)
on:
  pull_request:
    branches:
      - main
      - raw
    types: [opened, synchronize, reopened]

concurrency:
  group: validate-pr-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Verify sf CLI install
        run: sf --version

      - name: Authenticate to Salesforce org via JWT
        env:
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
        run: |
          echo "$SF_JWT_KEY" > ./server.key
          sf org login jwt \
            --client-id "${{ secrets.SF_CONSUMER_KEY }}" \
            --jwt-key-file ./server.key \
            --username "${{ secrets.SF_USERNAME }}" \
            --instance-url "${{ secrets.SF_INSTANCE_URL }}" \
            --alias target-org \
            --set-default
          rm ./server.key

      - name: Run static code analysis (optional but recommended)
        run: |
          sf plugins install @salesforce/sfdx-scanner
          sf scanner run --target "force-app" --format table || true

      - name: Validate deployment (check-only, no actual deploy)
        run: |
          sf project deploy validate \
            --source-dir force-app \
            --target-org target-org \
            --test-level RunLocalTests \
            --wait 30

      - name: Post validation result
        if: always()
        run: echo "Validation step completed with status ${{ job.status }}"